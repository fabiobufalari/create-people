# =========================================
# MS create-people
# =========================================

# =========================================
# Server Configuration
# =========================================
server:
  port: 8082 # Porta deste serviço (exemplo)
  #servlet:
    #context-path: /api # <<< MANTIDO O CONTEXT PATH /api
# =========================================
# Spring Boot Application Configuration
# =========================================
spring:
  application:
    name: create-people-service # Nome mais descritivo
  datasource:
    url: ${DATASOURCE_URL} # <<< BANCO CENTRALIZADO
    username: ${DATASOURCE_USERNAME_PROD}
    password: ${DATASOURCE_PASSWORD_PROD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  messages: # Configuração i18n (se mantida)
    basename: messages/messages # Verificar caminho
    encoding: UTF-8
    fallback-to-system-locale: false

# =========================================
# External Service URLs
# =========================================
authentication: # Nome da propriedade para auth service url
  service:
    url: ${AUTH_SERVICE_URL} # URL do Authentication Service

# =========================================
# JWT Configuration (Este serviço VALIDA) - Ajustado para o padrão
# =========================================
security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY} # <<< CHAVE IDÊNTICA

# =========================================
# Geocoding Configuration
# =========================================
geocoding:
  api:
    url: ${GEOCODING_API_URL}
    key: ${GEOCODING_API_KEY}
    timeout: ${GEOCODING_API_TIMEOUT}
    retries: ${GEOCODING_API_RETRIES}
    initialInterval: ${GEOCODING_API_INITIAL_INTERVAL}
    maxInterval: ${GEOCODING_API_MAX_INTERVAL}
    maxAttempts: ${MASX_ATTEMPTS} # Revisar se é 3 ou 4 (1 initial + retries)
#geocoding:
#  api:
#    url: "https://maps.googleapis.com/maps/api/geocode/json"
#    key: ${GEOCODING_API_KEY:AIzaSyA3jbxRsV1FSjXQYD3g5rYjvoKt9yI4ZkQ} # Usar variável de ambiente é melhor
#    timeout: 5000
#    retries: 3
#    initialInterval: 1000
#    maxInterval: 5000
#    maxAttempts: 3 # Revisar se é 3 ou 4 (1 initial + retries)    

# =========================================
# Logging Configuration
# =========================================
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.bufalari.people: DEBUG # Pacote raiz deste serviço
    org.hibernate.SQL: DEBUG

# =========================================
# Swagger/OpenAPI Configuration
# =========================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# =========================================
# Actuator Configuration
# =========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized